  # universitas, status 200 dicek 2026-11-22; pemilik 2026-11-22 memilih kalender diisi admin + tautan resmi.
  academic_calendar_url: null
  # Pertanyaan umum calon mahasiswa di calon-mahasiswa.html (pemilik 2026-11-20): daftar {question, answer}, atau
