  # [] / null = lencana tahap ditebak dari data (semester yang didominasi MK universitas: "Dasar sains dan umum").
  # Asal: pemilik 2026-11-22 (1-2 sains dasar, 3-4 dasar teknik, "dan seterusnya"); label 5-6 dan 7-8 usulan Claude.
  semester_stages:
