  base_url: null
  # Jumlah minimal alumni yang mengisi tracer study sebelum sebaran jawabannya (status, kesesuaian,
  # tingkat, jenis instansi, provinsi, kompetensi) tampil di alumni.html; di bawahnya hanya jumlah
  # pengisi. Satuan: orang. Nilai sah: bilangan bulat 1-100, atau null (sebaran tidak pernah
  # ditampilkan, hanya jumlah pengisi). Asal: keputusan pemilik 2026-11-17
  # (angka agregat saja, tampil setelah minimal 5 responden).
  alumni_min_respondents: 5
  # Isi beranda (index.html). Setiap null atau daftar kosong = bagian itu tidak ditampilkan.
