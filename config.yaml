  # code: A-Z/0-9, 2-12, tidak sama dengan expertise_groups; name: teks 1-120 huruf. [] / null = tidak ada.
  # Asal: Tabel 4-17 Dokumen Kurikulum K26 ("Peminatan Bidang Sipil Umum": 41419), diisi 2026-11-22 atas permintaan pemilik.
  elective_other_groups: []
  # Aturan MK pilihan kurikulum terbaru, tampil di kurikulum.html, calon-mahasiswa.html, dan halaman bidang.
