  # Diisi pemilik; jangan diisi dugaan (biaya, beasiswa, jalur masuk: arahkan ke halaman PMB universitas).
  faq: []
  # Kuis minat di calon-mahasiswa.html (pemilik 2026-11-21): "Bidang mana yang cocok untukmu?". Daftar
