  # mengambil 2 mata kuliah sesuai bidang peminatan topik TA"); dipilih pemilik 2026-11-22 atas kalimat lain di
  # dokumen yang sama ("12 sks menurut kelompok keahlian mulai semester VI").
  elective_rule: null
  # Tahap belajar per semester, tampil sebagai lencana pertama di "Perjalanan N semester" (calon-mahasiswa.html).
