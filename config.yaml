  # tertinggi (seri: semua yang tertinggi), beserta cakupan dan dosennya. Jawaban tidak disimpan atau dikirim.
  # [] / null = kuis tidak tampil.
  interest_quiz: []
  # Peminatan MK pilihan selain kelompok keahlian di atas. Kode MK pilihan per peminatan diisi di Data prodi >
