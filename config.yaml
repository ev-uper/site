  # diringkas dari halaman resmi program studi;
  # ubah bila prodi memakai rumusan lain.
  # Satu kalimat ciri khas prodi di bawah judul beranda; teks, maks. 200 huruf.
  tagline: null
  # Tagline bahasa Inggris untuk english.html (pemilik 2026-11-21); teks maks. 200 huruf, atau null (memakai tagline).
  # Asal: terjemahan Claude 2026-11-21 dari tagline di atas.
  tagline_en: null
  # Nama prodi bahasa Inggris (judul english.html, "<nama> Study Program"); teks maks. 120 huruf, atau null
  # (english.html tidak dibuat). Gelar lulusan; teks maks. 120 huruf, atau null. Asal: Dokumen Kurikulum K26 Bab 1
  # (gelar Sarjana Teknik, S.T.); nama Inggris Claude 2026-11-21.
  programme_name_en: null
  degree: null
  # Prospek karier lulusan: daftar; teks maks. 120 huruf. Asal: "Proyeksi Lulusan" di halaman resmi prodi.
  careers: []
  # Kelompok keahlian (KK) dosen, dalam urutan tampil di daftar dosen publik (instal-lengkap.sql).
  # Tiap baris: code = kode yang disimpan di dosen.kelompok_keahlian (huruf besar/angka, 2-12), name = nama
  # tampil (teks 1-120 huruf). Admin memilih KK tiap dosen di Kelola dosen. null atau [] = tanpa pengelompokan.
  # Asal: keputusan pemilik 2026-11-17 (urutan Struktur, SDA, Transportasi, Geoteknik, Manajemen Konstruksi;
  # nama mengikuti bidang keahlian baku, material digabung ke struktur).
