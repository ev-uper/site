  expertise_groups: []
  # Laboratorium: daftar nama; teks maks. 120 huruf. Asal: halaman Fasilitas prodi.
  laboratories: []
  # Kontak di kaki halaman dan halaman Kontak (kontak.html): alamat (teks), telepon (teks), email, jam layanan (teks),
