  # Nilai sah: teks 1-120 huruf, atau null (nama lembaga tidak ditampilkan). Asal: Dokumen Kurikulum K26 Bab 1
  # (Keputusan LAM Teknik No. 0443/SK/LAM Teknik/AS/XII/2023), diisi 2026-11-21 atas permintaan pemilik.
  accreditation_body: null
  # Berita prodi: URL https halaman berita, atau null. Asal: halaman resmi prodi.
  news_url: null
site_check:
  # Alamat situs terbit. Nilai sah: URL http/https. Asal: situs prodi.
  url: https://GANTI-ORG.github.io/cv-site
  # Browser yang dijalankan Selenium. Nilai sah: edge, chrome. Asal: usulan Claude 2026-11-05.
  browser: edge
  # Tanpa jendela; hanya berlaku bila tanpa login (--no-login). Nilai sah: true, false.
  headless: true
  # Ukuran layar video. Satuan: piksel. Nilai sah: 800-3840 dan 600-2160. Asal: usulan Claude.
  width: 1280
  height: 800
  # Tunggu halaman selesai memuat data. Satuan: detik. Nilai sah: angka >= 0. Asal: usulan Claude.
  wait_seconds: 4
  # Lama tiap layar di video. Satuan: detik. Nilai sah: 0,5-10. Asal: usulan Claude.
  seconds_per_screen: 2.5
  # Lama tiap layar di video --demo, cukup untuk membaca keterangan. Satuan: detik.
  # Nilai sah: 0,5-10. Asal: usulan Claude 2026-11-05.
  demo_seconds_per_screen: 4
  # Layar terbanyak yang digulir per halaman. Nilai sah: bilangan bulat 1-30. Asal: usulan Claude.
  max_screens: 4
  # Halaman yang dibuka, berurutan. path: alamat relatif; title: nama di video dan laporan;
  # must_contain: teks yang wajib ada (opsional); note: keterangan di video --demo.
  pages:
    - {path: "index.html", title: "Beranda", note: "beranda program studi untuk umum", must_contain: ['Dosen']}
    - {path: "kinerja.html", title: "Kinerja", note: "rekap kinerja prodi untuk umum", must_contain: ['Dosen']}
    - {path: "dosen.html", title: "Daftar dosen", note: "profil dan karya tiap dosen"}
    - {path: "mitra.html", title: "Mitra", note: "daftar mitra kerja sama"}
    - {path: "daftar.html", title: "Daftar karya", note: "publikasi, penelitian, PkM, dan luaran terverifikasi"}
    - {path: "ruang-kerja.html", title: "Ruang kerja", note: "halaman awal setelah masuk"}
    - {path: "karya.html", title: "Karya dosen", note: "dosen mengisi karya dan buktinya; admin memverifikasi"}
    - {path: "profil.html", title: "Profil saya", note: "data dosen untuk LKPS; perubahan disetujui admin"}
    - {path: "monitoring.html", title: "Pemantauan kinerja", note: "kinerja per tahun, per dosen, dan syarat unggul"}
    - {path: "grafik.html", title: "Grafik untuk LED", note: "grafik siap tempel untuk LED dan laporan"}
    - {path: "skor.html", title: "Skor akreditasi dan LED", note: "perkiraan skor; unduh draf LED, tabel LKPS, indeks bukti", must_contain: ['Unduh dokumen akreditasi']}
    - {path: "rincian.html?butir=23", title: "Rincian butir", note: "data di balik angka tiap butir"}
    - {path: "narasi-led.html", title: "Narasi LED", note: "isi narasi per butir; tersimpan dan masuk draf LED"}
    - {path: "kelengkapan.html", title: "Kelengkapan LED", note: "daftar periksa otomatis yang sudah dan belum terisi"}
    - {path: "input-butir.html", title: "Isian butir", note: "butir kualitatif dan bukti per butir"}
    - {path: "kelola-dosen.html", title: "Kelola dosen", note: "daftar dosen dan peran akun"}
    - {path: "panduan.html", title: "Panduan", note: "langkah pemakaian untuk dosen dan admin"}
    - {path: "data-prodi.html?tab=tracer", title: "Data prodi: Tracer study", note: "data lulusan untuk tabel 6.f dan 6.g"}
    - {path: "data-prodi.html?tab=kerjasama", title: "Data prodi: Kerja sama", note: "kerja sama induk, dengan contoh manfaat"}
    - {path: "data-prodi.html?tab=mk", title: "Data prodi: Mata kuliah", note: "kurikulum, RPS, dan capstone"}
    - {path: "data-prodi.html?tab=target", title: "Data prodi: Target IKU/IKT", note: "target dan capaian untuk LED"}
    - {path: "data-prodi.html?tab=dokumen", title: "Data prodi: Dokumen", note: "pustaka: satu dokumen tersimpan sekali, ditautkan ke banyak bukti"}

# Coba situs di komputer sendiri dengan data contoh, tanpa Supabase/GitHub/Google
# (python coba_lokal.py di repo templat; pemilik 2026-11-12).
coba_lokal:
  # Port localhost untuk situs coba (http://localhost:<port>/). Nilai sah: bilangan
  # bulat 1024-65535 yang tidak dipakai program lain. Asal: usulan Claude 2026-11-12.
  port: 8790

uji_asap:
  # Uji asap tools/uji_asap.py (pemilik 2026-11-12): situs coba lokal dibuka per halaman per peran,
  # galat JavaScript, "Halaman gagal dimuat", "Memuat…" yang tak selesai, dan geser mendatar dicatat.
  # Semua nilai di bawah usulan Claude 2026-11-12; ubah bebas.
  # Port localhost situs coba selama uji. Nilai sah: bilangan bulat 1024-65535 yang tidak dipakai program lain.
  port: 8798
  # Peran yang diuji: nama -> email di data contoh (tools/coba/seed.py); 'tamu' = tanpa login.
  peran:
    admin: admin@contoh.ac.id
    pimpinan: pimpinan@contoh.ac.id
    dosen: adi@contoh.ac.id
    asesor: asesor@contoh.ac.id
    tamu: tamu
  # Lebar layar, piksel. Komputer untuk semua peran; ponsel hanya untuk peran di ponsel_untuk.
  lebar_komputer: 1280
  lebar_ponsel: 390
  ponsel_untuk: [admin, dosen, tamu]
  # Batas tunggu satu halaman sampai tulisan "Memuat…" hilang, detik (bilangan 1-60).
  batas_muat_detik: 10
  # Jeda setelah halaman selesai dimuat sebelum diperiksa, detik (0-10).
  tunggu_detik: 1.0
  # Gambar layar: semua (tiap halaman, tiap peran, tiap lebar) atau masalah (hanya yang bermasalah).
  gambar: masalah

rps_import:
  # Impor RPS dari Word formulir K26 (pemilik 2026-11-19): tools/rps_dari_word.py menulis usulan ke folder ini,
  # pemilik meninjau laporan .md, mengubah "siap": true di berkas .json, lalu menjalankan tools/impor_rps.py.
  # Folder usulan, relatif terhadap akar repo. Nilai sah: nama folder. Asal: usulan Claude 2026-11-19.
  folder: impor-rps
  # true = RPS/struktur yang sudah ada di situs untuk MK itu boleh ditimpa (hanya bila RPS masih draf).
  # false = MK yang sudah punya isian dilewati. Nilai sah: true/false. Asal: usulan Claude 2026-11-19 (aman: false).
  timpa: false

# Cadangan berkas Google Drive prodi ke komputer/hard disk prodi (run_cadangan_drive.py; pemilik 2026-11-20).
# Folder tujuan di config.local.yaml paths.drive_backup_dir (di luar repo). Kunci CADANGAN_DRIVE_KUNCI di rahasia.env.
drive_backup:
  # Ukuran satu potongan unduhan, MB. Apps Script membatasi ukuran jawaban (isi dikirim base64, +33%), jadi potongan
  # besar bisa gagal. Nilai sah: bilangan bulat 1-20 (Apps Script menolak > 20). Asal: default Claude 2026-11-20.
  chunk_mb: 8
  # true = versi lama berkas yang berubah di Drive disalin ke _versi_lama/<tanggal>/ sebelum ditimpa (melindungi dari
  # berkas yang diganti isinya, sengaja atau tidak). false = hanya versi terbaru. Nilai sah: true/false.
  # Asal: default Claude 2026-11-20.
  keep_old_versions: true

# Penyusunan jadwal kuliah (run_jadwal.py; rencana pemilik 2026-11-21, aturan pemilik 2026-11-22). Masukan = berkas
# "jadwal_masukan_<TA>_<semester>.json" yang diunduh dari situs (Jadwal kuliah > Unduh masukan penjadwalan) ke folder
# config.local.yaml paths.schedule_dir; hasil ditulis di folder yang sama lalu diimpor kembali di situs.
# Ruang TIDAK ditempatkan penjalan: ruang dari universitas diisi prodi di situs (pemilik 2026-11-22).
schedule:
  # Lama tatap muka per sks per minggu, menit; dibulatkan ke atas ke ukuran slot jam di situs (30 menit):
  # 2 sks = 100 -> 120 menit, 3 sks = 150 menit. Nilai sah: bilangan bulat 10-120. Asal: pemilik 2026-11-22.
  minutes_per_sks: 50
  # Jeda minimal antara dua kelas berlabel sama (mis. kelas A) dalam satu semester paket dan kurikulum yang sama pada
  # hari yang sama, menit. Kelas berlabel sama tidak pernah bentrok (wajib). Nilai sah: bilangan bulat 0-180.
  # Asal: pemilik 2026-11-22 ("label sama tidak bentrok ... istirahat 30 menit sebelum kelas berikutnya").
  same_label_break_minutes: 30
  # true = semua MK pilihan satu kurikulum tidak saling bentrok (wajib), supaya mahasiswa bisa mengambil beberapa
  # pilihan; false = MK pilihan hanya dicek bentrok dosen. Nilai sah: true/false. Asal: pemilik 2026-11-22.
  electives_no_overlap: true
  # Jam yang WAJIB kosong. day: 1 = Senin ... 7 = Minggu, atau "all" = semua hari; start/end "HH:MM" (WIB).
  # Asal: pemilik 2026-11-22 (Jumat 11.30-13.00 untuk salat Jumat).
  blocked:
    - {day: 5, start: "11:30", end: "13:00"}
  # Jam yang DIHINDARI bila bisa (anjuran; boleh dipakai bila jadwal tidak muat). Bentuk sama dengan blocked.
  # Asal: rencana 2026-11-21 yang diterima pemilik, ditegaskan pemilik 2026-11-22 ("hindari bila bisa").
  avoid:
    - {day: all, start: "12:00", end: "13:00"}
  # Batas jam mengajar satu dosen per hari (anjuran), jam; null = tanpa batas. Nilai sah: angka 1-12 atau null.
  # Asal: pemilik 2026-11-22.
  lecturer_daily_max_hours: 6
  # Bobot anjuran dalam fungsi tujuan (makin besar makin dihindari). Satuan: per slot 30 menit, kecuali
  # dated_unavailability = per pertemuan yang terkena berhalangan bertanggal (tanggal tertentu / rentang tanggal).
  # Berhalangan MINGGUAN selalu wajib dihindari. Nilai sah: angka >= 0. Asal: usulan Claude 2026-11-22, boleh diubah.
  weights:
    avoid: 10
    lecturer_overload: 20
    dated_unavailability: 5
    # Pemecah seri kecil: mulai lebih pagi sedikit lebih disukai, supaya hasil stabil dari run ke run.
    earlier_start: 0.01
  # Batas waktu pemecah (HiGHS), detik. Bila habis, jadwal terbaik yang ditemukan dipakai dan ditandai di laporan.
  # Nilai sah: bilangan bulat 10-3600. Asal: usulan Claude 2026-11-22.
  time_limit_seconds: 120
