  # scope dipakai cakupan bidang keahlian baku berkode sama (daftar umum, bisa tidak sesuai MK prodi). Asal scope:
  # nama MK wajib dan pilihan K26 per bidang (Daftar MK K26 untuk Situs, 2026-11-20); pemilik 2026-11-21: tanpa
